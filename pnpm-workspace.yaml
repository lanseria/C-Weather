shellEmulator: true
strictPeerDependencies: false

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - tinyclip@0.1.13

packages: []

catalogs:
  backend:
    '@nuxtjs/mcp-toolkit': ^0.24.3
    undici: ^8.12.3
  build:
    '@nuxt/eslint': ^1.17.0
    '@nuxtjs/color-mode': ^4.1.0
    '@pinia/nuxt': ^1.0.3
    '@unocss/eslint-config': ^66.12.0
    '@unocss/nuxt': ^66.12.0
    '@unocss/preset-web-fonts': ^66.12.0
    '@vueuse/nuxt': ^15.0.0
    nuxt: ^4.6.3
    unocss: ^66.12.0
    unplugin: ^3.7.0
    vite: ^8.3.5
  dev:
    '@antfu/eslint-config': ^10.0.0
    eslint: ^10.14.0
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.3
    vue-tsc: ^3.3.14
  frontend:
    '@vueuse/core': ^15.0.0
    date-fns: ^4.4.0
    pinia: ^4.1.0
    vue: ^3.5.44
  icons:
    '@iconify-json/carbon': ^1.2.29
    '@iconify-json/tabler': ^1.2.43
    '@iconify-json/wi': ^1.2.1
  utils:
    zod: ^4.6.7

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  isolated-vm: true
  unrs-resolver: true
