shellEmulator: true
strictPeerDependencies: false

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - tinyclip@0.1.13

packages: []

catalogs:
  backend:
    '@nuxtjs/mcp-toolkit': ^0.19.0
    undici: ^8.10.0
  build:
    '@nuxt/eslint': ^1.17.0
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^1.0.2
    '@unocss/eslint-config': ^66.8.1
    '@unocss/nuxt': ^66.8.1
    '@unocss/preset-web-fonts': ^66.8.1
    '@vueuse/nuxt': ^14.4.0
    nuxt: ^4.5.2
    unocss: ^66.8.1
    unplugin: ^3.3.0
    vite: ^8.2.2
  dev:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.9.1
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.3
    vue-tsc: ^3.3.11
  frontend:
    '@vueuse/core': ^14.4.0
    date-fns: ^4.4.0
    pinia: ^4.0.3
    vue: ^3.5.42
  icons:
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/tabler': ^1.2.38
    '@iconify-json/wi': ^1.2.1
  utils:
    zod: ^4.4.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  isolated-vm: true
  unrs-resolver: true
